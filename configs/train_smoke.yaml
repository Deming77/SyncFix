# Short run used to check that the training stack is wired correctly end to end.
# Same model and losses as configs/train.yaml, but only 100 steps on a handful of shards.

# Backbone
backbone_signature: stabilityai/stable-diffusion-xl-base-1.0
unet_input_channels: 4
vae_num_channels: 4

# Bridge
timestep_sampling: custom_timesteps
selected_timesteps: [250, 500, 750, 1000]
prob: [0.25, 0.25, 0.25, 0.25]
bridge_noise_sigma: 0.005
conditioning_images_keys: []
conditioning_masks_keys: []

# Losses
latent_loss_type: l2
latent_loss_weight: 1.0
pixel_loss_type: lpips
pixel_loss_weight: 10.0
use_l1_pixel_loss: true
use_ssim_loss: true
use_gram_loss: true

# Multi-view synchronization
pair_num_views: 2
pair_window: 15
use_ref: true

# Data
train_shards:
  - pipe:cat /cis/net/r49/data_fromRemus/wds_ref_depth_final/train/pairs-{000000..000003}.tar
validation_shards:
  - pipe:cat /cis/net/r49/data_fromRemus/wds_ref_depth_final/eval/pairs-{000000..000001}.tar

# Optimization
# One scene per step keeps the smoke test runnable on a partially occupied GPU;
# the view structure is the same as in configs/train.yaml.
batch_size: 1
learning_rate: 4.0e-5
optimizer: AdamW
num_steps: [1]
max_steps: 100

# Checkpointing and logging
pretrained_path: null
resume_from_checkpoint: false
save_ckpt_path: ./checkpoints/test_single
save_interval: 100
save_top_k: 1
log_interval: 25
wandb_project: syncfix
wandb_offline: true
