# Default SyncFix training configuration.
# A copy of this file is written next to the checkpoints as `config.yaml` and is what
# `get_pretrained_model` reads back at inference time.

# Backbone
backbone_signature: stabilityai/stable-diffusion-xl-base-1.0
unet_input_channels: 4
vae_num_channels: 4

# Bridge
timestep_sampling: custom_timesteps
selected_timesteps: [250, 500, 750, 1000]
prob: [0.25, 0.25, 0.25, 0.25]
bridge_noise_sigma: 0.005
conditioning_images_keys: []
conditioning_masks_keys: []

# Losses
latent_loss_type: l2 # l1 l2
latent_loss_weight: 1.0
pixel_loss_type: lpips # l1 l2 lpips
pixel_loss_weight: 10.0
use_l1_pixel_loss: true
use_ssim_loss: true
use_gram_loss: true

# Multi-view synchronization: pair_num_views degraded views plus one clean reference
pair_num_views: 2
pair_window: 15
use_ref: true

# Data
train_shards:
  - pipe:cat /path/to/wds/train/pairs-{000000..000131}.tar
validation_shards:
  - pipe:cat /path/to/wds/eval/pairs-{000000..000006}.tar

# Optimization
batch_size: 2
learning_rate: 4.0e-5
optimizer: AdamW
num_steps: [1]
max_steps: 100000

# Checkpointing and logging
pretrained_path: null
resume_from_checkpoint: true
save_ckpt_path: ./checkpoints/syncfix
save_interval: 10000
save_top_k: 3
log_interval: 1000
wandb_project: syncfix
wandb_offline: false
